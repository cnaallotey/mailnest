name: Docker
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [Dockerfile, .dockerignore, package.json, package-lock.json, 'app/**', 'server/**', 'lib/**', 'bin/**', .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for this machine and start it, so a broken image never gets published.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mailnest:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mailnest -p 1080:1080 -p 1025:1025 mailnest:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mailnest)" = "healthy" ] && break
            sleep 1
          done
          docker logs mailnest
          curl -fsS http://127.0.0.1:1080/api/config
          docker run --rm mailnest:test check --help

      # Only version tags publish. v1.2.3 becomes :1.2.3, :1.2 and :latest.
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
